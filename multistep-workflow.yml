name: Multi Step Workflow

on:
  push:
    branches:
      - main

jobs:
  demo-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Print Date
        run: date

      - name: List Files
        run: ls -la

      - name: Print Working Directory
        run: pwd