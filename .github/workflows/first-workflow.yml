name: First Workflow

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run build
        run: echo "Building..."

      - name: Trigger Second Workflow
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: run-second-workflow
          client-payload: '{"ref": "${{ github.ref }}"}'

      - name: Wait for Second Workflow to complete
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Waiting for Second Workflow to start..."
          sleep 10
          REPO="${{ github.repository }}"
          TIMEOUT=300
          ELAPSED=0
          while true; do
            STATUS=$(gh run list \
              --repo "$REPO" \
              --workflow "second-workflow.yml" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0].status')
            CONCLUSION=$(gh run list \
              --repo "$REPO" \
              --workflow "second-workflow.yml" \
              --limit 1 \
              --json status,conclusion \
              --jq '.[0].conclusion')
            echo "Second Workflow status: $STATUS | conclusion: $CONCLUSION"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "Second Workflow completed successfully!"
                exit 0
              else
                echo "Second Workflow failed!"
                exit 1
              fi
            fi
            if [ "$ELAPSED" -ge "$TIMEOUT" ]; then
              echo "Timed out!"
              exit 1
            fi
            sleep 15
            ELAPSED=$((ELAPSED + 15))
          done

      - name: Continue after Second Workflow
        run: echo "Both workflows done!"
