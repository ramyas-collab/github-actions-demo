name: Second Workflow

on:
  repository_dispatch:
    types: [run-second-workflow]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Do the work
        run: |
          echo "Second Workflow running..."
          echo "Triggered from branch: ${{ github.event.client_payload.ref }}"
          sleep 20
          echo "Second Workflow done!"